version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meetingflow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/meetingflow?schema=public"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

  scheduler:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/meetingflow?schema=public"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
    command: ["npm", "run", "scheduler"]

volumes:
  db-data:
