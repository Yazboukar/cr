version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meetingflow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/meetingflow?schema=public"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db-data:
